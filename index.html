<!DOCTYPE html>
<html>
<head>
    <title>Maze Solver</title>
    <style>
        body {
            background-color: #333;
            color: white;
        }
        #maze {
            border: 5px solid #444;
            border-radius: 5px;
            background-color: #666; /* The "floor" of the maze */
            border-collapse: collapse;
        }
        #maze td {
            font-size: 0;
        }
        .wall {
            background-color: #888;
            border-top: 1px solid #aaa;
            border-left: 1px solid #aaa;
            border-bottom: 1px solid #555;
            border-right: 1px solid #555;
        }
        .passage {
            background-color: #ccc;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }
        .hover-enabled .passage:hover {
            background-color: #e0e0e0;
        }
        .start {
            background-color: #2a9d8f; /* A nice teal color */
        }
        .end {
            background-color: #e76f51; /* A nice coral color */
        }
        .solution-path {
            background-color: #e9c46a; /* A nice gold color */
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2), 0 0 5px #e9c46a;
            animation: glow 1.5s infinite alternate;
        }
        .dead-end {
            background-color: #f4a261; /* A nice sandy orange */
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2);
        }
        .visited {
            background-color: #5d5d5d;
            transition: background-color 0.5s;
        }
        .frontier {
            background-color: #8d8d8d;
            animation: pulse 1s infinite;
        }
        .carving {
            background-color: #ffcc00;
        }
        @keyframes pulse {
            0% { background-color: #8d8d8d; }
            50% { background-color: #a3a3a3; }
            100% { background-color: #8d8d8d; }
        }
        @keyframes glow {
            from { box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2), 0 0 5px #e9c46a; }
            to { box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2), 0 0 15px #e9c46a, 0 0 20px #e9c46a; }
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.1s ease;
        }
        button:active {
            transform: scale(0.95);
        }
        #generate-button { background-color: #2a9d8f; } /* Teal */
        #solve-button { background-color: #e9c46a; }    /* Gold */
        #mark-dead-ends-button { background-color: #f4a261; } /* Sandy Orange */
        #reset-button { background-color: #e76f51; }    /* Coral */
        #controls-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            background-color: #444;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        #fog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle 150px at 50% 50%, transparent, #000000dd 200px, #000000 300px);
            display: none;
        }
        .rating-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .smiley {
            font-size: 3em;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            filter: grayscale(100%);
        }
        .smiley:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div id="fog-overlay"></div>
    <div id="controls-container">
        <div>
            <label for="size-slider">Maze Size:</label>
            <input type="range" id="size-slider" min="5" max="51" value="21" step="2">
            <span id="size-value">21</span>
        </div>
        <div>
            <label for="cell-size-slider">Cell Size (px):</label>
            <input type="range" id="cell-size-slider" min="5" max="40" value="20">
            <span id="cell-size-value">20</span>
        </div>
        <div>
            <label for="complexity-slider">Complexity:</label>
            <input type="range" id="complexity-slider" min="0" max="50" value="10">
            <span id="complexity-value">10</span>
        </div>
    <div>
        <label for="fog-toggle">Fog of War:</label>
        <input type="checkbox" id="fog-toggle">
    </div>
    <div>
        <label for="animate-gen-toggle">Animate Generation:</label>
        <input type="checkbox" id="animate-gen-toggle" checked>
    </div>
    <div>
        <label for="animate-solver-toggle">Animate Solver:</label>
        <input type="checkbox" id="animate-solver-toggle" checked>
    </div>
    <div>
        <label for="hover-toggle">Hover Highlight:</label>
        <input type="checkbox" id="hover-toggle" checked>
    </div>
    </div>
    <div class="rating-container">
        <span class="smiley" data-rating="1">😡</span>
        <span class="smiley" data-rating="2">😠</span>
        <span class="smiley" data-rating="3">😐</span>
        <span class="smiley" data-rating="4">😊</span>
        <span class="smiley" data-rating="5">😄</span>
    </div>
    <div id="maze-container"></div>
    <button id="generate-button">New Maze</button>
    <button id="solve-button">Solve Maze</button>
    <button id="mark-dead-ends-button">Mark Dead Ends</button>
    <button id="reset-button">Reset</button>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            let explorationInterval = null;
            let pathInterval = null;
            let generationInterval = null;

            const mazeGenerator = {
                width: 21,
                height: 21,
                complexity: 10,
                grid: [],

                initializeGrid: function() {
                    this.grid = [];
                    for (let y = 0; y < this.height; y++) {
                        this.grid[y] = [];
                        for (let x = 0; x < this.width; x++) {
                            this.grid[y][x] = 1; // 1 for wall
                        }
                    }
                },

                generate: function() {
                    this.initializeGrid();
                    this.carvePassages(1, 1);
                    this.addComplexity();
                    this.grid[1][1] = 'S';
                    this.grid[this.height - 2][this.width - 2] = 'E';
                },

                carvePassages: function(cx, cy) {
                    this.grid[cy][cx] = 0;
                    const directions = [[0, -2], [0, 2], [2, 0], [-2, 0]];
                    directions.sort(() => Math.random() - 0.5);
                    directions.forEach(d => {
                        const nx = cx + d[0];
                        const ny = cy + d[1];
                        if (nx > 0 && nx < this.width - 1 && ny > 0 && ny < this.height - 1 && this.grid[ny][nx] === 1) {
                            this.grid[cy + d[1] / 2][cx + d[0] / 2] = 0;
                            this.grid[ny][nx] = 0;
                            this.carvePassages(nx, ny);
                        }
                    });
                },

                animatedGenerate: function() {
                    this.initializeGrid();
                    const stack = [];
                    const startX = 1;
                    const startY = 1;
                    this.grid[startY][startX] = 0;
                    stack.push([startX, startY]);

                    this.display();

                    generationInterval = setInterval(() => {
                        if (stack.length > 0) {
                            const [cx, cy] = stack[stack.length - 1];
                            $('.carving').removeClass('carving');
                            $(`#cell-${cx}-${cy}`).addClass('carving');

                            const directions = [[0, -2], [0, 2], [2, 0], [-2, 0]];
                            directions.sort(() => Math.random() - 0.5);

                            let foundNeighbor = false;
                            for (const d of directions) {
                                const nx = cx + d[0];
                                const ny = cy + d[1];

                                if (nx > 0 && nx < this.width - 1 && ny > 0 && ny < this.height - 1 && this.grid[ny][nx] === 1) {
                                    this.grid[cy + d[1] / 2][cx + d[0] / 2] = 0;
                                    this.grid[ny][nx] = 0;

                                    $(`#cell-${cx + d[0] / 2}-${cy + d[1] / 2}`).removeClass('wall').addClass('passage');
                                    $(`#cell-${nx}-${ny}`).removeClass('wall').addClass('passage');

                                    stack.push([nx, ny]);
                                    foundNeighbor = true;
                                    break;
                                }
                            }

                            if (!foundNeighbor) {
                                stack.pop();
                            }
                        } else {
                            clearInterval(generationInterval);
                            $('.carving').removeClass('carving');
                            this.addComplexity();
                            this.grid[1][1] = 'S';
                            this.grid[this.height - 2][this.width - 2] = 'E';
                            this.display();
                        }
                    }, 10);
                },

                addComplexity: function() {
                    for (let i = 0; i < this.complexity; i++) {
                        const x = Math.floor(Math.random() * (this.width - 2)) + 1;
                        const y = Math.floor(Math.random() * (this.height - 2)) + 1;
                        if (this.grid[y][x] === 1) {
                            this.grid[y][x] = 0;
                        }
                    }
                },

                display: function() {
                    const mazeContainer = $('#maze-container');
                    mazeContainer.empty();
                    const table = $('<table id="maze"></table>');
                    for (let y = 0; y < this.height; y++) {
                        const row = $('<tr></tr>');
                        for (let x = 0; x < this.width; x++) {
                            const cellData = this.grid[y][x];
                            let cellClass = '';
                            let openWalls = '';
                            switch (cellData) {
                                case 1: cellClass = 'wall'; break;
                                case 0: case 'S': case 'E':
                                    cellClass = 'passage';
                                    if (cellData === 'S') cellClass += ' start';
                                    if (cellData === 'E') cellClass += ' end';
                                    if (y > 0 && this.grid[y - 1][x] !== 1) openWalls += 'N';
                                    if (y < this.height - 1 && this.grid[y + 1][x] !== 1) openWalls += 'S';
                                    if (x > 0 && this.grid[y][x - 1] !== 1) openWalls += 'W';
                                    if (x < this.width - 1 && this.grid[y][x + 1] !== 1) openWalls += 'E';
                                    break;
                            }
                            const cell = $(`<td id="cell-${x}-${y}" class="${cellClass}" data-x="${x}" data-y="${y}" data-open="${openWalls}"></td>`);
                            row.append(cell);
                        }
                        table.append(row);
                    }
                    mazeContainer.append(table);
                    $('#hover-toggle').trigger('change');
                }
            };

            $('#size-slider').on('input', function() {
                const size = $(this).val();
                $('#size-value').text(size);
            });

            $('#complexity-slider').on('input', function() {
                const complexity = $(this).val();
                $('#complexity-value').text(complexity);
            });

            $('#fog-toggle').on('change', function() {
                if ($(this).is(':checked')) {
                    $('#fog-overlay').show();
                } else {
                    $('#fog-overlay').hide();
                }
            });

            $('#hover-toggle').on('change', function() {
                $('#maze-container').toggleClass('hover-enabled', $(this).is(':checked'));
            }).trigger('change');

            $(document).on('mousemove', function(e) {
                if ($('#fog-toggle').is(':checked')) {
                    $('#fog-overlay').css({
                        background: `radial-gradient(circle 150px at ${e.pageX}px ${e.pageY}px, transparent, #000000dd 200px, #000000 300px)`
                    });
                }
            });

            $('#cell-size-slider').on('input', function() {
                const cellSize = $(this).val();
                $('#cell-size-value').text(cellSize);
                let style = $('#dynamic-style');
                if (style.length === 0) {
                    style = $('<style id="dynamic-style"></style>').appendTo('head');
                }
                style.text(`#maze td { width: ${cellSize}px; height: ${cellSize}px; }`);
            }).trigger('input');

            function getNeighbors(cellId) {
                const neighbors = [];
                const cell = $('#' + cellId);
                if (!cell.length) return neighbors;
                const x = parseInt(cell.data('x'));
                const y = parseInt(cell.data('y'));
                const openWalls = cell.data('open') || '';
                if (openWalls.includes('N')) neighbors.push(`cell-${x}-${y - 1}`);
                if (openWalls.includes('S')) neighbors.push(`cell-${x}-${y + 1}`);
                if (openWalls.includes('W')) neighbors.push(`cell-${x - 1}-${y}`);
                if (openWalls.includes('E')) neighbors.push(`cell-${x + 1}-${y}`);
                return neighbors;
            }

            function bfs(start, end) {
                const queue = [];
                const visited = new Set();
                const parent = {};
                const startId = start.attr('id');
                const endId = end.attr('id');
                queue.push(startId);
                visited.add(startId);
                while (queue.length > 0) {
                    const currentId = queue.shift();
                    if (currentId === endId) {
                        let path = [];
                        let current = endId;
                        while (current) {
                            path.unshift(current);
                            current = parent[current];
                        }
                        return path;
                    }
                    const neighbors = getNeighbors(currentId);
                    neighbors.forEach(neighborId => {
                        if (!visited.has(neighborId)) {
                            visited.add(neighborId);
                            parent[neighborId] = currentId;
                            queue.push(neighborId);
                        }
                    });
                }
                return null;
            }

            function animated_bfs(start, end, onComplete) {
                const queue = [];
                const visited = new Set();
                const parent = {};
                const startId = start.attr('id');
                const endId = end.attr('id');
                queue.push(startId);
                visited.add(startId);

                explorationInterval = setInterval(function() {
                    if (queue.length > 0) {
                        const currentId = queue.shift();
                        const cell = $('#' + currentId);
                        if (!cell.hasClass('start') && !cell.hasClass('end')) {
                            cell.addClass('visited').removeClass('frontier');
                        }
                        if (currentId === endId) {
                            clearInterval(explorationInterval);
                            let path = [];
                            let current = endId;
                            while (current) {
                                path.unshift(current);
                                current = parent[current];
                            }
                            onComplete(path);
                            return;
                        }
                        const neighbors = getNeighbors(currentId);
                        neighbors.forEach(neighborId => {
                            if (!visited.has(neighborId)) {
                                visited.add(neighborId);
                                parent[neighborId] = currentId;
                                queue.push(neighborId);
                                const neighborCell = $('#' + neighborId);
                                if (!neighborCell.hasClass('start') && !neighborCell.hasClass('end')) {
                                    neighborCell.addClass('frontier');
                                }
                            }
                        });
                    } else {
                        clearInterval(explorationInterval);
                        onComplete(null);
                    }
                }, 20);
            }

            $('#mark-dead-ends-button').on('click', function() {
                $('.passage').each(function() {
                    const cellId = $(this).attr('id');
                    if (getNeighbors(cellId).length === 1) {
                        if (!$(this).hasClass('start') && !$(this).hasClass('end')) {
                            $(this).addClass('dead-end');
                        }
                    }
                });
            });

            $('#solve-button').on('click', function() {
                clearInterval(explorationInterval);
                clearInterval(pathInterval);
                $('.solution-path, .dead-end, .visited, .frontier').removeClass('solution-path dead-end visited frontier');

                const startCell = $('.start');
                const endCell = $('.end');

                if ($('#animate-solver-toggle').is(':checked')) {
                    animated_bfs(startCell, endCell, function(path) {
                        if (path) {
                            let i = 0;
                            pathInterval = setInterval(function() {
                                if (i < path.length) {
                                    $('.visited, .frontier').removeClass('visited frontier');
                                    $('#' + path[i]).addClass('solution-path');
                                    i++;
                                } else {
                                    clearInterval(pathInterval);
                                }
                            }, 50);
                        } else {
                            alert('No path found!');
                        }
                    });
                } else {
                    const path = bfs(startCell, endCell);
                    if (path) {
                        path.forEach(cellId => {
                            $('#' + cellId).addClass('solution-path');
                        });
                    } else {
                        alert('No path found!');
                    }
                }
            });

            $('#reset-button').on('click', function() {
                clearInterval(explorationInterval);
                clearInterval(pathInterval);
                $('.solution-path, .dead-end, .visited, .frontier').removeClass('solution-path dead-end visited frontier');
            });

            function newMaze() {
                clearInterval(explorationInterval);
                clearInterval(pathInterval);
                clearInterval(generationInterval);
                const size = parseInt($('#size-slider').val());
                const complexity = parseInt($('#complexity-slider').val());
                mazeGenerator.width = size;
                mazeGenerator.height = size;
                mazeGenerator.complexity = complexity;
                if ($('#animate-gen-toggle').is(':checked')) {
                    mazeGenerator.animatedGenerate();
                } else {
                    mazeGenerator.generate();
                    mazeGenerator.display();
                }
                $('#cell-size-slider').trigger('input');
            }

            $('#generate-button').on('click', newMaze);

            newMaze(); // Initial maze

            let currentRating = 0;
            $('.smiley').on('click', function() {
                currentRating = $(this).data('rating');
            });

            $('.rating-container').on('mouseenter', '.smiley', function() {
                const rating = $(this).data('rating');
                $('.smiley').each(function() {
                    $(this).css('filter',
                        $(this).data('rating') <= rating
                        ? 'grayscale(0%)'
                        : 'grayscale(100%)'
                    );
                });
            }).on('mouseleave', function() {
                $('.smiley').each(function() {
                     $(this).css('filter',
                        $(this).data('rating') <= currentRating
                        ? 'grayscale(0%)'
                        : 'grayscale(100%)'
                    );
                });
            });
        });
    </script>
</body>
</html>
